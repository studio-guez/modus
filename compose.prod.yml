# Deployment stack (preprod & production).
#
# This file is shipped to the target server by the deploy workflow
# (.github/actions/deploy) and started from $DEPLOY_PATH/current/.
#
# - Images are pre-built by CI and pulled from GHCR — nothing is built here.
# - Every service publishes on ${BIND_ADDRESS} only (127.0.0.1 by default).
#   TLS termination, hostname routing and certificates are handled by the
#   reverse proxy (nginx), outside this project.
# - All mutable state lives under ${SHARED_PATH} on the host, outside any
#   release directory, so image rebuilds and rollbacks never touch it.
#
# Variables:
# - SHARED_PATH, *_IMAGE_TAG are exported by the deploy action.
# - BIND_ADDRESS and *_HTTP_PORT come from ${SHARED_PATH}/deploy.env (passed via
#   --env-file); the ports can be overridden per environment by the
#   {CMS,WEBSITE}_HTTP_PORT GitHub Actions variables, which the deploy action
#   exports.
# - Set BIND_ADDRESS to the server's private IP when the reverse proxy runs on
#   another machine; keep 127.0.0.1 when it runs on the same host.

services:

  # Kirby CMS
  cms:
    image: ghcr.io/studio-guez/modus/cms:${CMS_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CMS_HTTP_PORT:-8080}:80"
    # Ne monter QUE l'état mutable : le code vient de l'image. Bind mounts (et non
    # volumes nommés) pour que le contenu reste rsyncable/sauvegardable depuis l'hôte.
    volumes:
      - ${SHARED_PATH}/cms/content:/var/www/html/content
      - ${SHARED_PATH}/cms/media:/var/www/html/media
      - ${SHARED_PATH}/cms/site/accounts:/var/www/html/site/accounts
      - ${SHARED_PATH}/cms/site/sessions:/var/www/html/site/sessions
      - ${SHARED_PATH}/cms/site/cache:/var/www/html/site/cache
      # Kirby license file (added manually on first deploy or registered from the
      # Panel). File bind mount so it survives redeploys — the deploy action seeds
      # an empty file, otherwise Docker would create a directory in its place.
      - ${SHARED_PATH}/cms/site/config/.license:/var/www/html/site/config/.license
    env_file:
      - ${SHARED_PATH}/cms.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Nuxt
  website:
    image: ghcr.io/studio-guez/modus/website:${WEBSITE_IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBSITE_HTTP_PORT:-8081}:3000"
    # File bind mounts so both are editable on the host without a rebuild:
    # robots.txt (e.g. to lock crawlers out on preprod) and .htpasswd, which
    # gates the whole site behind HTTP Basic auth as soon as it holds an entry.
    # The deploy action seeds .htpasswd empty — empty means no auth, so it stays
    # opt-in and has to be filled in by hand (see README, "Password-protecting a
    # site"). /health is exempt, otherwise the healthcheck would fail the deploy.
    volumes:
      - ${SHARED_PATH}/website/robots.txt:/app/robots.txt
      - ${SHARED_PATH}/website/.htpasswd:/app/.htpasswd
    # SSR fetches the API over the Docker network instead of hairpinning through
    # the public domain (nginx). Kirby still emits public URLs, see CMS_URL in
    # cms.env. The browser-facing NUXT_PUBLIC_API_BASE_URL is baked into the
    # image at build time (og:image meta), so it is not repeated here.
    environment:
      - NUXT_API_BASE_URL_SERVER=http://cms
    restart: unless-stopped
    depends_on:
      - cms
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
